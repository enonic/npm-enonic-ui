catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.3.0
  vite-plus: ^1.0.0

overrides:
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver

minimumReleaseAge: 4320

trustPolicy: no-downgrade
# 6.3.1 is the ReDoS backport to the 6.x line, published after 7.x gained provenance.
trustPolicyExclude:
  - semver@6.3.1
