name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A 0.x minor is breaking by convention but reports as `semver-minor`, so the
      # update-type gate alone would auto-merge it. There is no test suite behind
      # this, so 0.x packages are held back for review.
      - name: Enable auto-merge for patch and minor updates
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, 'vite-plus') &&
          !contains(steps.meta.outputs.dependency-names, 'class-variance-authority')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
