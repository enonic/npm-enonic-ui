version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    # Only widen a published range when the new version needs it. The default
    # (`increase`) keeps raising the floors consumers have to satisfy.
    versioning-strategy: 'increase-if-necessary'
    assignees:
      - 'edloidas'
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      majors:
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    assignees:
      - 'edloidas'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
