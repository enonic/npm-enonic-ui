version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    # The default, `increase`, would keep raising published range floors.
    versioning-strategy: 'increase-if-necessary'
    assignees:
      - 'edloidas'
    cooldown:
      default-days: 3
    ignore:
      # Types track the Node release line; raise this ceiling when .nvmrc moves.
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      majors:
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    assignees:
      - 'edloidas'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
